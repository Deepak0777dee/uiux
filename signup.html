<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Stackly Online Education</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    
    <!-- Left Side: Form -->
    <div class="auth-form-side">
      <div class="auth-header" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="auth-logo">
          <img src="images/logo-stackly.webp" alt="Stackly Logo">
        </a>
        <a href="index.html" style="font-size: 0.85rem; color: #555; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 0.4rem;">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
      
      <div class="auth-content">
        <h1 class="auth-title">Get Started Now</h1>
        <p class="auth-subtitle">Create an account to begin your learning journey</p>

        <form id="signupForm">
          
          <div class="form-group">
            <label>Select Role</label>
            <div class="role-selector">
              <label class="role-label">
                <input type="radio" name="role" value="student" checked>
                <span class="role-btn">Student</span>
              </label>
              <label class="role-label">
                <input type="radio" name="role" value="admin">
                <span class="role-btn">Admin</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required pattern="[A-Za-z\s]+" title="Only letters and spaces allowed.">
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required 
                   pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}" 
                   title="Must contain at least one letter, one number, one special character, and at least 8 or more characters">
            <button type="button" class="pwd-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
            <button type="button" class="pwd-toggle" onclick="togglePassword('confirm_password', this)" aria-label="Toggle confirm password visibility">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
            <div class="error-message" id="confirmPwdError">Passwords do not match!</div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="404.html">terms & policy</a></label>
          </div>

          <button type="submit" class="btn-submit">Signup</button>

          <div class="divider">Or</div>

          <div class="social-login">
            <button type="button" class="btn-social" onclick="window.location.href='404.html'">
              <i class="fa-brands fa-google" style="color:#DB4437;"></i> Sign in with Google
            </button>
            <button type="button" class="btn-social" onclick="window.location.href='404.html'">
              <i class="fa-brands fa-apple" style="font-size:1.1rem;"></i> Sign in with Apple
            </button>
          </div>

          <div class="auth-bottom">
            Have an account? <a href="login.html">Sign In</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Right Side: Image -->
    <div class="auth-image-side">
      <div class="auth-image-wrapper">
        <img src="images/register.webp" alt="Students studying">
      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
  <script>
    // Toggle Password Visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    }

    // Validation: Confirm Password match
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');
    const confirmError = document.getElementById('confirmPwdError');

    function validatePassword() {
      if(password.value != confirmPassword.value) {
        confirmPassword.setCustomValidity("Passwords Don't Match");
        confirmError.style.display = "block";
      } else {
        confirmPassword.setCustomValidity('');
        confirmError.style.display = "none";
      }
    }
    password.onchange = validatePassword;
    confirmPassword.onkeyup = validatePassword;

    // Real-time name validation to prevent integers
    const nameInput = document.getElementById('name');
    nameInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^A-Za-z\s]/g, '');
    });

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if(password.value !== confirmPassword.value) {
        return;
      }

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      
      if (typeof authSignup === 'function') {
        const res = authSignup(name, email, password.value, '', role);
        if (res.success) {
          window.location.href = 'login.html';
        }
      } else {
        alert('Signup success as ' + role);
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
