<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Stackly</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f2f9f7; /* Light greenish background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a4338; /* Dark green text */
    }
    
    .error-container {
      text-align: center;
      position: relative;
      max-width: 800px;
      width: 100%;
      padding: 20px;
    }
    
    .illustration-wrapper {
      position: relative;
      margin-bottom: 30px;
    }
    
    .illustration {
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      mix-blend-mode: multiply; /* Blends the white background into the page color */
    }
    
    h1 {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    h1 span.highlight {
      color: #03805b; /* Green highlight for Oops! */
    }
    
    p.desc {
      font-size: 16px;
      color: #5c746d;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #007654;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.3s ease;
      margin-bottom: 40px;
    }
    
    .btn-home:hover {
      background-color: #005c42;
    }
    
    .bottom-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #5c746d;
      text-decoration: none;
      font-size: 14px;
    }
    
    .bottom-link i {
      color: #007654;
      font-size: 18px;
    }
    
    .bottom-link span.highlight-link {
      color: #007654;
      font-weight: 500;
    }
    
    .bottom-link:hover span.highlight-link {
      text-decoration: underline;
    }
    
    /* Decorative elements */
    .bg-shape {
      position: absolute;
      z-index: -1;
      opacity: 0.1;
    }
    .shape-1 { top: 5%; left: 5%; width: 150px; height: 150px; background: #007654; border-radius: 50%; filter: blur(50px); }
    .shape-2 { bottom: 10%; right: 5%; width: 200px; height: 200px; background: #007654; border-radius: 50%; filter: blur(80px); }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="error-container">
    <div class="illustration-wrapper">
      <img src="images/404-illustration.webp" alt="404 Page Not Found" class="illustration" style="max-width: 600px;" />
    </div>
    
    <h1><span class="highlight">Oops!</span> Page Not Found</h1>
    <p class="desc">The page you are looking for might have been removed,<br>had its name changed, or is temporarily unavailable.</p>
    
    <a href="index.html" class="btn-home">
      <i class="fa-solid fa-house"></i> Go Back to Home
    </a>
    
    <div style="margin-top: 20px;">
      <a href="courses-public.html" class="bottom-link">
        <i class="fa-regular fa-lightbulb"></i> Or explore our <span class="highlight-link">courses</span> and keep learning!
      </a>
    </div>
  </div>

</body>
</html>
