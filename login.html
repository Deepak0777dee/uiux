<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stackly Online Education</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    
    <!-- Left Side: Form -->
    <div class="auth-form-side">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <img src="images/logo-stackly.webp" alt="Stackly Logo">
        </a>
      </div>
      
      <div class="auth-content">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Enter your Credentials to access your account</p>

        <form id="loginForm">
          
          <div class="form-group">
            <label>Select Role</label>
            <div class="role-selector">
              <label class="role-label">
                <input type="radio" name="role" value="student" checked>
                <span class="role-btn">Student</span>
              </label>
              <label class="role-label">
                <input type="radio" name="role" value="admin">
                <span class="role-btn">Admin</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <a href="404.html" class="forgot-pwd">forgot password</a>
            <input type="password" id="password" name="password" placeholder="Enter your password" required 
                   pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}" 
                   title="Must contain at least one letter, one number, one special character, and at least 8 or more characters">
            <button type="button" class="pwd-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
            <div class="error-message" id="pwdError">Invalid password format.</div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember for 30 days</label>
          </div>

          <button type="submit" class="btn-submit">Login</button>

          <div class="divider">Or</div>

          <div class="social-login">
            <button type="button" class="btn-social" onclick="window.location.href='404.html'">
              <i class="fa-brands fa-google" style="color:#DB4437;"></i> Sign in with Google
            </button>
            <button type="button" class="btn-social" onclick="window.location.href='404.html'">
              <i class="fa-brands fa-apple" style="font-size:1.1rem;"></i> Sign in with Apple
            </button>
          </div>

          <div class="auth-bottom">
            Don't have an account? <a href="signup.html">Sign Up</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Right Side: Image -->
    <div class="auth-image-side">
      <div class="auth-image-wrapper">
        <img src="images/sigin.webp" alt="Library">
      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      
      // We rely on auth.js for actual auth logic for dummy testing
      if (typeof authLogin === 'function') {
        const res = authLogin(email, password, role);
        if (res.success) {
          window.location.href = 'dashboard.html';
        }
      } else {
        alert('Login success as ' + role);
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
